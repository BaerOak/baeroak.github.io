<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      color-scheme: dark;
      --background: #030c18;
      --card: #0b1a2e;
      --line: #1c2d45;
      --text: #e8edf4;
      --muted: #9aa8ba;
      --accent: #f4ba41;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); }
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 20px; }
    header.site { border-bottom: 1px solid var(--line); }
    header.site .wrap { display: flex; align-items: center; height: 60px; }
    header.site a { color: var(--text); font-weight: 700; letter-spacing: 0.02em; text-decoration: none; }
    main { padding: 40px 0 56px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
    h2 { font-size: 1.25rem; margin: 40px 0 8px; }
    p, li { color: var(--text); }
    em, .muted { color: var(--muted); }
    li { margin: 4px 0; }
    .app-head { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
    .app-head img { width: 96px; height: 96px; border-radius: 22px; flex: none; }
    .app-head p { margin: 0; color: var(--muted); }
    .app-card {
      display: flex; align-items: center; gap: 16px;
      padding: 16px; margin: 12px 0;
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      color: var(--text); text-decoration: none;
    }
    .app-card img { width: 64px; height: 64px; border-radius: 15px; flex: none; }
    .app-card strong { display: block; font-size: 1.1rem; }
    .app-card span { color: var(--muted); }
    .app-card:hover { border-color: var(--accent); }
    footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header class="site"><div class="wrap"><a href="{{ '/' | relative_url }}">BaerOak</a></div></header>
  <main><div class="wrap">
{{ content }}
  </div></main>
  <footer><div class="wrap">© {{ site.time | date: '%Y' }} BaerOak · <a href="mailto:{{ site.email }}">{{ site.email }}</a></div></footer>
</body>
</html>
